<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PANEL DE CONTROL</title>
    <!-- Fuentes e Iconos -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: var(--bg-primary);
            color: var(--text-main);
            overflow: hidden;
        }

        /* Header y Navegación Superior */
        header {
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 0.75rem 1rem 0.5rem 1rem;
            gap: 0.5rem;
            z-index: 10;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent-color);
            letter-spacing: 0.5px;
        }

        .external-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            transition: color 0.2s;
        }

        .external-link:hover {
            color: var(--accent-color);
        }

        /* Menú de Navegación Horizontal (Práctico para Celular) */
        nav {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding-bottom: 0.25rem;
            -webkit-overflow-scrolling: touch;
        }

        /* Ocultar barra de scroll */
        nav::-webkit-scrollbar {
            display: none;
        }
        nav {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .nav-btn {
            flex: 1;
            min-width: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.6rem 0.8rem;
            border-radius: 8px;
            color: var(--text-muted);
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .nav-btn:hover, .nav-btn.active {
            background-color: var(--accent-color);
            color: #0f172a;
            border-color: var(--accent-color);
        }

        /* Área Principal de Contenido */
        main {
            flex: 1;
            position: relative;
            width: 100%;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: none;
        }

        iframe.active {
            display: block;
        }
    </style>
</head>
<body>

    <!-- Panel Superior -->
    <header>
        <div class="top-bar">
            <div class="brand">
                <i class="fa-solid fa-sliders"></i>
                <span>PANEL DE CONTROL</span>
            </div>
            <a id="external-url" href="https://gabrielrgr-wq.github.io/BACHEO-2026/" target="_blank" class="external-link">
                <span>Abrir externo</span>
                <i class="fa-solid fa-arrow-up-right-from-square"></i>
            </a>
        </div>

        <!-- Botones de comando superiores -->
        <nav>
            <button class="nav-btn active" onclick="switchApp('bacheo', this)">
                <i class="fa-solid fa-road"></i>
                BACHEO-2026
            </button>
            <button class="nav-btn" onclick="switchApp('reclamos', this)">
                <i class="fa-solid fa-clipboard-list"></i>
                FORMULARIOS al 2026
            </button>
        </nav>
    </header>

    <!-- Visor de Aplicaciones -->
    <main>
        <iframe id="iframe-bacheo" class="active" src="https://gabrielrgr-wq.github.io/BACHEO-2026/"></iframe>
        <iframe id="iframe-reclamos" src="https://gabrielrgr-wq.github.io/app1/"></iframe>
    </main>

    <script>
        const urls = {
            'bacheo': 'https://gabrielrgr-wq.github.io/BACHEO-2026/',
            'reclamos': 'https://gabrielrgr-wq.github.io/app1/'
        };

        function switchApp(appId, element) {
            // Cambiar la pestaña activa
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');

            // Cambiar iframe activo
            document.querySelectorAll('iframe').forEach(frame => frame.classList.remove('active'));
            document.getElementById(`iframe-${appId}`).classList.add('active');

            // Actualizar enlace de apertura externa
            document.getElementById('external-url').href = urls[appId];
        }
    </script>
</body>
</html>
